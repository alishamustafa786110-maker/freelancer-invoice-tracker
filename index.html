<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hisaab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #10231c;
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 { color: #0f6b4f; margin-bottom: 4px; }
    .box {
      background: white;
      border: 1px solid #d5e0db;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #d5e0db;
      border-radius: 6px;
      box-sizing: border-box;
    }
    #saveBtn {
      background: #0f6b4f;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 16px;
      margin-top: 16px;
      cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 8px 4px;
      border-bottom: 1px solid #d5e0db;
      font-size: 14px;
    }
    #message { color: #a32f2f; }
    .totals {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .totals div {
      background: white;
      border: 1px solid #d5e0db;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
    .totals b { display: block; font-size: 18px; }
    .status {
      border: none;
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .paid { background: #dff2ea; color: #0f6b4f; }
    .pending { background: #fdf0d2; color: #8a5a00; }
    .overdue { background: #fbe1e1; color: #a32f2f; }
  </style>
</head>
<body>
  <h1>Hisaab</h1>
  <p>Create invoices and track payments.</p>

  <div class="totals">
    <div>Received<b id="tPaid">0</b></div>
    <div>Pending<b id="tPending">0</b></div>
    <div>Overdue<b id="tOverdue">0</b></div>
  </div>

  <div class="box">
    <h2>New invoice</h2>

    <label for="client">Client name</label>
    <input id="client" type="text">

    <label for="work">Work description</label>
    <input id="work" type="text">

    <label for="amount">Amount</label>
    <input id="amount" type="number">

    <label for="currency">Currency</label>
    <select id="currency">
      <option>PKR</option>
      <option>USD</option>
    </select>

    <label for="due">Due date</label>
    <input id="due" type="date">

    <button id="saveBtn">Save invoice</button>
    <p id="message"></p>
  </div>

  <div class="box">
    <h2>Your invoices</h2>
    <table>
      <thead>
        <tr><th>Client</th><th>Amount</th><th>Due</th><th>Status</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <p id="empty">No invoices yet. Save your first one above.</p>
    <p style="font-size:13px">Tap a status to switch between pending and paid. Totals are in PKR (1 USD = 280 PKR).</p>
  </div>

  <script>
   var invoices = JSON.parse(localStorage.getItem("hisaab-invoices") || "[]");
    var USD_RATE = 280;

    function toPKR(inv) {
      var amount = Number(inv.amount);
      return inv.currency === "USD" ? amount * USD_RATE : amount;
    }

    function getStatus(inv) {
      if (inv.paid) { return "paid"; }
      var today = new Date().toISOString().slice(0, 10);
      if (inv.due !== "" && inv.due < today) { return "overdue"; }
      return "pending";
    }

    function toggleStatus(index) {
      invoices[index].paid = !invoices[index].paid;
      showInvoices();
    }

    function showInvoices() {
      var rows = "";
    localStorage.setItem("hisaab-invoices", JSON.stringify(invoices));

      for (var i = 0; i < invoices.length; i++) {
        var inv = invoices[i];
        var status = getStatus(inv);
        var value = toPKR(inv);

        if (status === "paid") { paid += value; }
        else if (status === "overdue") { overdue += value; }
        else { pending += value; }

        rows += "<tr><td>" + inv.client + "</td><td>" +
          inv.currency + " " + inv.amount + "</td><td>" +
          (inv.due || "-") + "</td><td>" +
          "<button class='status " + status + "' onclick='toggleStatus(" + i + ")'>" +
          status + "</button></td></tr>";
      }

      document.getElementById("list").innerHTML = rows;
      document.getElementById("empty").style.display =
        invoices.length > 0 ? "none" : "block";
      document.getElementById("tPaid").textContent = Math.round(paid).toLocaleString();
      document.getElementById("tPending").textContent = Math.round(pending).toLocaleString();
      document.getElementById("tOverdue").textContent = Math.round(overdue).toLocaleString();
    }

    document.getElementById("saveBtn").onclick = function () {
      var client = document.getElementById("client").value;
      var work = document.getElementById("work").value;
      var amount = document.getElementById("amount").value;
      var currency = document.getElementById("currency").value;
      var due = document.getElementById("due").value;

      if (client === "" || amount === "") {
        document.getElementById("message").textContent =
          "Please enter the client name and amount.";
        return;
      }

      invoices.push({
        client: client,
        work: work,
        amount: amount,
        currency: currency,
        due: due,
        paid: false
      });

      document.getElementById("message").textContent = "";
      document.getElementById("client").value = "";
      document.getElementById("work").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("due").value = "";

      showInvoices();
    };

    showInvoices();
  </script>
</body>
</html>
