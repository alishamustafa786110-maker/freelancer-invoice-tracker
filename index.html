<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hisaab</title>
</head>
<body>
  <h1>Hisaab</h1>
  <p>Create invoices and track payments.</p>

  <h2>New invoice</h2>

  <label for="client">Client name</label><br>
  <input id="client" type="text"><br><br>

  <label for="work">Work description</label><br>
  <input id="work" type="text"><br><br>

  <label for="amount">Amount</label><br>
  <input id="amount" type="number"><br><br>

  <label for="currency">Currency</label><br>
  <select id="currency">
    <option>PKR</option>
    <option>USD</option>
  </select><br><br>

  <label for="due">Due date</label><br>
  <input id="due" type="date"><br><br>

  <button>Save invoice</button>
</body>
</html>
